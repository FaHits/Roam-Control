name: Xcode 27 verification

on:
  push:
    branches:
      - feat/manual-running-routes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets and schemes
        run: xcodebuild -list -project RoamControl.xcodeproj

      - name: Run RoamControlTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -only-testing:RoamControlTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Debug
        run: |
          set -o pipefail
          xcodebuild build \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

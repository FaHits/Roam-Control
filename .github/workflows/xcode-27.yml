name: Xcode 27 verification

on:
  push:
    branches:
      - main
      - feat/manual-running-routes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets and schemes
        run: xcodebuild -list -project RoamControl.xcodeproj

      - name: Check localization catalogs
        run: python3 scripts/check_localizations.py

      - name: Check invariants
        run: |
          python3 scripts/check_invariants.py --self-test
          python3 scripts/check_invariants.py

      # Serial on purpose: the scheme marks this target `parallelizable="YES"`, and a
      # parallel run swallows each clone's stdout into the result bundle, so the
      # `PROBE ` lines from SearchProbeTests never reached this log (run 41994924084
      # printed only the trailing summary). Serial streams test output to the console.
      - name: Run RoamControlTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -only-testing:RoamControlTests \
            -parallel-testing-enabled NO \
            ROAMCONTROL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CODE_SIGNING_ALLOWED=NO

      # Task 33: the same probes under a Chinese locale, because locale is the one
      # measured difference left between this runner (en_US/GMT) and the phone. No
      # retry here on purpose: this run is evidence, and a retry would hide the
      # answer it exists to produce. `PROBE G-locale` is the line that proves
      # `-testLanguage`/`-testRegion` actually took effect.
      - name: Run RoamControlTests (zh-Hans, CN)
        run: |
          set -o pipefail
          xcodebuild test \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -only-testing:RoamControlTests \
            -parallel-testing-enabled NO \
            -testLanguage zh-Hans \
            -testRegion CN \
            ROAMCONTROL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CODE_SIGNING_ALLOWED=NO

      # The simulator launch is the flaky part, not our code: run 41963265863 failed
      # `app.launch()` with "DTServiceHubClient failed to bless service hub" on three
      # attempts and then passed on the fourth with no code change, while the same
      # commit passed in run 41961868111. Retry once inside this step instead of a
      # human pressing re-run. `-test-iterations 2` pins the attempt count to two
      # (one retry); `-retry-tests-on-failure` makes the second attempt re-run only
      # the cases that failed, so an all-green run costs no extra time. No unit-test,
      # invariant or IPA step gets a retry.
      - name: Run RoamControlUITests (1 retry)
        run: |
          set -o pipefail
          rm -rf ui.xcresult ui-shots
          xcodebuild test \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -only-testing:RoamControlUITests \
            -test-iterations 2 \
            -retry-tests-on-failure \
            -resultBundlePath ui.xcresult \
            ROAMCONTROL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI test screenshots
        if: always()
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path ui.xcresult --output-path ui-shots

      - name: List UI screenshot names
        if: always()
        run: |
          ls -R ui-shots
          jq -r '.[] | .attachments[]? | "\(.suggestedHumanReadableName) -> \(.exportedFileName)"' ui-shots/manifest.json

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roam-ui-screenshots
          path: ui-shots
          if-no-files-found: error
          retention-days: 14

      - name: Build Debug
        run: |
          set -o pipefail
          xcodebuild build \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  unsigned-ipa:
    needs: test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned device archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RoamControl.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ROAMCONTROL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/RoamControl.xcarchive/Products/Applications/RoamControl.app"
          test -d "$APP_PATH"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          ditto "$APP_PATH" "$PWD/build/Payload/RoamControl.app"
          cd "$PWD/build"
          zip -qry RoamControl-unsigned.ipa Payload
          unzip -l RoamControl-unsigned.ipa | sed -n '1,20p'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoamControl-unsigned-ipa
          path: build/RoamControl-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  unsigned-ipa-debug:
    needs: test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show build configuration
        run: |
          xcodebuild -showBuildSettings \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Debug 2>/dev/null \
            | grep -E '^ +(CONFIGURATION|SWIFT_OPTIMIZATION_LEVEL|SWIFT_ACTIVE_COMPILATION_CONDITIONS) ='

      - name: Build unsigned debug device archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project RoamControl.xcodeproj \
            -scheme RoamControl \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RoamControl-Debug.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ROAMCONTROL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify debug probe is compiled in
        run: |
          set -euo pipefail
          BIN="$PWD/build/RoamControl-Debug.xcarchive/Products/Applications/RoamControl.app/RoamControl"
          test -f "$BIN"
          echo "binary: $BIN"
          HITS=$(strings -a "$BIN" | grep -cF 'Probe (Debug)' || true)
          echo "self-check 'Probe (Debug)' hits: $HITS"
          strings -a "$BIN" | grep -F 'Probe (Debug)' | head -3
          if [ "$HITS" -eq 0 ]; then
            echo "self-check FAILED: 'Probe (Debug)' is missing from the debug binary"
            exit 1
          fi

      - name: Package debug unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/RoamControl-Debug.xcarchive/Products/Applications/RoamControl.app"
          test -d "$APP_PATH"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          ditto "$APP_PATH" "$PWD/build/Payload/RoamControl.app"
          cd "$PWD/build"
          zip -qry RoamControl-unsigned-debug.ipa Payload
          unzip -l RoamControl-unsigned-debug.ipa | sed -n '1,20p'

      - name: Upload unsigned debug IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoamControl-unsigned-debug-ipa
          path: build/RoamControl-unsigned-debug.ipa
          if-no-files-found: error
          retention-days: 14
